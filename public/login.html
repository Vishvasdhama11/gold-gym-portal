<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Gym - Portal Login</title>
  <link rel="stylesheet" href="/css/style.css?v=gold1">
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #1A2130 0%, #0D1117 65%, #05070A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-main);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 38px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header .brand-logo {
      margin-bottom: 16px;
      justify-content: center;
    }

    .login-title {
      font-size: 1.45rem;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .alert-banner {
      display: none;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #F87171;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition);
      font-weight: 600;
    }

    .back-home:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <a href="/" class="brand-logo">
          <div class="brand-icon">
            <!-- Dumbbell Gym SVG -->
            <svg fill="currentColor" viewBox="0 0 24 24">
              <path d="M5 4h1v16H5V4zm13 0h1v16h-1V4zM3 7h2v10H3V7zm16 0h2v10h-2V7zm-8 4h2v2h-2v-2zm-3 0h2v2H8v-2zm6 0h2v2h-2v-2zM6 9h12v6H6V9z"/>
            </svg>
          </div>
          <span>Gold Gym</span>
        </a>
        <h1 class="login-title">Gym Portal Login</h1>
        <p class="login-subtitle">Enter your Mobile Number / User ID to sign in</p>
      </div>

      <!-- Error Alert Banner (Hidden by default, only shown if wrong ID/Pass is submitted) -->
      <div id="login-error-banner" class="alert-banner" style="display: none;">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink: 0;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span id="login-error-text">Invalid Mobile Number / User ID or Password</span>
      </div>

      <!-- Common Login Form (For both Admin & Gym Members) -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="identifier">Mobile Number / User ID</label>
          <input 
            type="text" 
            id="identifier" 
            name="identifier" 
            class="form-input" 
            placeholder="0123456789" 
            required 
            autocomplete="username"
            autofocus
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-password-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="toggle-password-btn" id="toggle-password-btn" title="Show or hide password" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 8px;">
          <span>Sign In to Portal</span>
        </button>
      </form>
    </div>

    <a href="/" class="back-home">← Back to Gold Gym Homepage</a>
  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js?v=gym6"></script>
  <script src="/js/login.js?v=gym6"></script>
</body>
</html>
